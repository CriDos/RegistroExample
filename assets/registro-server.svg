<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft ambient drop shadow for front plate -->
    <filter id="shadow-front" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#091e42" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#091e42" flood-opacity="0.2" />
    </filter>

    <!-- Soft drop shadow for back plate -->
    <filter id="shadow-back" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#091e42" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#091e42" flood-opacity="0.15" />
    </filter>

    <!-- Front plate royal blue gradient (Office / Fluent style) -->
    <linearGradient id="grad-front" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Back plate azure/cyan gradient -->
    <linearGradient id="grad-back" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Inner specular highlight -->
    <linearGradient id="specular-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="back-plate-clip">
      <rect x="172" y="132" width="276" height="296" rx="52" ry="52" />
    </clipPath>
  </defs>

  <!-- BACK LAYER: Circuit / Network Bus Board -->
  <g filter="url(#shadow-back)">
    <rect x="172" y="132" width="276" height="296" rx="52" ry="52" fill="url(#grad-back)" />
  </g>

  <!-- Back Sheet Internal Graphics: High-Tech PCB & Data Routing -->
  <g clip-path="url(#back-plate-clip)" opacity="0.45">
    <!-- Top-right bus routes -->
    <polyline points="330,170 370,170 395,195 425,195" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="425" cy="195" r="7" fill="#ffffff" />
    
    <polyline points="330,210 390,210 410,230 425,230" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="425" cy="230" r="7" fill="#ffffff" />

    <polyline points="330,260 360,260 385,285 425,285" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="425" cy="285" r="7" fill="#ffffff" />

    <!-- Lower exposed network traces -->
    <polyline points="210,360 270,360 295,385 360,385" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="360" cy="385" r="7" fill="#ffffff" />

    <polyline points="210,395 240,395 260,415 315,415" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="315" cy="415" r="7" fill="#ffffff" />
  </g>

  <!-- FRONT LAYER: Main Royal Blue App Tile -->
  <g filter="url(#shadow-front)">
    <rect x="64" y="64" width="280" height="280" rx="60" ry="60" fill="url(#grad-front)" />
    <!-- Fluent top-edge bevel highlight -->
    <rect x="64" y="64" width="280" height="280" rx="60" ry="60" fill="none" stroke="url(#specular-front)" stroke-width="2" />
  </g>

  <!-- SERVER ICON SYMBOL (Server Blade Rack + SQLite Database Disks) -->
  <g id="server-symbol">
    <!-- Server Rack Frame (Left) -->
    <rect x="130" y="122" width="90" height="164" rx="10" fill="#ffffff" />
    
    <!-- Rack Server Slots (Blue cutouts inside the frame) -->
    <!-- Slot 1 -->
    <rect x="138" y="130" width="74" height="26" rx="4" fill="#2563eb" />
    <circle cx="147" cy="143" r="3.5" fill="#38bdf8" />
    <circle cx="157" cy="143" r="3.5" fill="#ffffff" opacity="0.8" />
    <rect x="170" y="141" width="34" height="4" rx="2" fill="#ffffff" opacity="0.7" />

    <!-- Slot 2 -->
    <rect x="138" y="162" width="74" height="26" rx="4" fill="#2563eb" />
    <circle cx="147" cy="175" r="3.5" fill="#38bdf8" />
    <circle cx="157" cy="175" r="3.5" fill="#ffffff" opacity="0.8" />
    <rect x="170" y="173" width="34" height="4" rx="2" fill="#ffffff" opacity="0.7" />

    <!-- Slot 3 -->
    <rect x="138" y="194" width="74" height="26" rx="4" fill="#2563eb" />
    <circle cx="147" cy="207" r="3.5" fill="#38bdf8" />
    <circle cx="157" cy="207" r="3.5" fill="#ffffff" opacity="0.8" />
    <rect x="170" y="205" width="34" height="4" rx="2" fill="#ffffff" opacity="0.7" />

    <!-- Slot 4 -->
    <rect x="138" y="226" width="74" height="26" rx="4" fill="#2563eb" />
    <circle cx="147" cy="239" r="3.5" fill="#38bdf8" />
    <circle cx="157" cy="239" r="3.5" fill="#ffffff" opacity="0.8" />
    <rect x="170" y="237" width="34" height="4" rx="2" fill="#ffffff" opacity="0.7" />

    <!-- Slot 5 -->
    <rect x="138" y="258" width="74" height="20" rx="4" fill="#2563eb" />
    <circle cx="147" cy="268" r="3" fill="#38bdf8" />
    <rect x="160" y="266" width="44" height="4" rx="2" fill="#ffffff" opacity="0.5" />

    <!-- Database Storage Cylinder Stack (Overlapping Right) -->
    <!-- Shadow behind database cylinder for visual separation from rack -->
    <path d="M 194 180 C 194 171, 214 164, 240 164 C 266 164, 286 171, 286 180 L 286 270 C 286 279, 266 286, 240 286 C 214 286, 194 279, 194 270 Z"
          fill="#2563eb" />

    <!-- Disk Tier 1 (Top) -->
    <path d="M 198 180 C 198 173, 217 167, 240 167 C 263 167, 282 173, 282 180 L 282 205 C 282 212, 263 218, 240 218 C 217 218, 198 212, 198 205 Z"
          fill="#ffffff" />
    <ellipse cx="240" cy="180" rx="42" ry="13" fill="#f1f5f9" />
    <ellipse cx="240" cy="180" rx="40" ry="11" fill="#ffffff" />
    <!-- Activity LED on disk 1 -->
    <circle cx="270" cy="198" r="3" fill="#2563eb" />

    <!-- Disk Tier 2 (Middle) -->
    <path d="M 198 214 C 198 221, 217 227, 240 227 C 263 227, 282 221, 282 214 L 282 239 C 282 246, 263 252, 240 252 C 217 252, 198 246, 198 239 Z"
          fill="#ffffff" />
    <!-- Activity LED on disk 2 -->
    <circle cx="270" cy="232" r="3" fill="#2563eb" />

    <!-- Disk Tier 3 (Bottom) -->
    <path d="M 198 248 C 198 255, 217 261, 240 261 C 263 261, 282 255, 282 248 L 282 273 C 282 280, 263 286, 240 286 C 217 286, 198 280, 198 273 Z"
          fill="#ffffff" />
    <!-- Activity LED on disk 3 -->
    <circle cx="270" cy="266" r="3" fill="#2563eb" />
  </g>
</svg>
