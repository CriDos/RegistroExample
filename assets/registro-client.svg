<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft ambient drop shadow for front plate -->
    <filter id="shadow-front" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#091e42" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#091e42" flood-opacity="0.2" />
    </filter>

    <!-- Soft drop shadow for back plate -->
    <filter id="shadow-back" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#091e42" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#091e42" flood-opacity="0.15" />
    </filter>

    <!-- Front plate royal blue gradient (Office / Fluent style) -->
    <linearGradient id="grad-front" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Back plate azure/cyan gradient -->
    <linearGradient id="grad-back" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Inner specular highlight -->
    <linearGradient id="specular-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <clipPath id="back-plate-clip">
      <rect x="172" y="132" width="276" height="296" rx="52" ry="52" />
    </clipPath>
  </defs>

  <!-- BACK LAYER: Document Catalog Sheet -->
  <g filter="url(#shadow-back)">
    <rect x="172" y="132" width="276" height="296" rx="52" ry="52" fill="url(#grad-back)" />
  </g>

  <!-- Back Sheet Internal Graphics: Catalog / Registry Rows -->
  <g clip-path="url(#back-plate-clip)" opacity="0.45">
    <!-- Horizontal table grid / catalog entry lines -->
    <line x1="330" y1="180" x2="416" y2="180" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <line x1="330" y1="214" x2="416" y2="214" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <line x1="330" y1="248" x2="396" y2="248" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <line x1="330" y1="282" x2="416" y2="282" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    
    <!-- Lower exposed rows -->
    <line x1="210" y1="362" x2="416" y2="362" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <line x1="210" y1="392" x2="350" y2="392" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />

    <!-- Subtle vertical column separator -->
    <line x1="312" y1="140" x2="312" y2="320" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- FRONT LAYER: Main Royal Blue App Tile -->
  <g filter="url(#shadow-front)">
    <rect x="64" y="64" width="280" height="280" rx="60" ry="60" fill="url(#grad-front)" />
    <!-- Fluent top-edge bevel highlight -->
    <rect x="64" y="64" width="280" height="280" rx="60" ry="60" fill="none" stroke="url(#specular-front)" stroke-width="2" />
  </g>

  <!-- CLIENT ICON SYMBOL (Clean Client ID / Profile Card Badge) -->
  <g id="client-symbol">
    <!-- User Silhouette: Head -->
    <circle cx="204" cy="144" r="28" fill="#ffffff" />
    
    <!-- User Silhouette: Shoulders / Torso -->
    <path d="M 158 202 C 158 178, 178 174, 204 174 C 230 174, 250 178, 250 202 Z" fill="#ffffff" />

    <!-- Badge Clip / Lanyard Hook -->
    <rect x="196" y="194" width="16" height="12" rx="3" fill="#ffffff" />

    <!-- Client Card Body -->
    <rect x="134" y="202" width="140" height="92" rx="12" fill="#ffffff" />

    <!-- Details on the Card (Blue cutouts) -->
    <!-- Mini photo portrait on the card -->
    <circle cx="162" cy="238" r="13" fill="#2563eb" />
    <path d="M 148 266 C 148 253, 154 250, 162 250 C 170 250, 176 253, 176 266 Z" fill="#2563eb" />

    <!-- Client Info Rows -->
    <rect x="185" y="226" width="75" height="8" rx="4" fill="#2563eb" />
    <rect x="185" y="242" width="58" height="8" rx="4" fill="#2563eb" />
    <rect x="185" y="258" width="67" height="8" rx="4" fill="#2563eb" />
    <rect x="185" y="274" width="42" height="7" rx="3.5" fill="#2563eb" opacity="0.75" />
  </g>
</svg>
